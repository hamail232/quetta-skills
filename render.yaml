services:
  - type: web
    name: quetta-skills
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: quetta_skills
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false